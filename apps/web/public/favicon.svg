<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="pavana">
  <!-- Ikon aplikasi v2: turunan tipografis huruf "p" lowercase dari Comfortaa
    bobot 700 — keluarga font yang sama dengan wordmark "pavana" (interim aktif,
    lihat packages/brand/README.md). Outline diekstrak dari glyph Comfortaa
    Variable (wght 700) dan disimpan sebagai <path>, bukan <text>, supaya
    bentuknya deterministik tanpa bergantung pada font saat favicon dirender.
    Huruf diletakkan tepat di tengah kanvas pada tinggi 46/64; stroke 1 unit
    adalah kompensasi optis agar tetap terbaca pada ukuran tab 16 px.
    Warna mengikuti token brand: huruf Mist #F5F1EB di atas gradasi dusk
    ungu gelap ke mauve berasap (#252B4D → #4E3B5E → #8A5F74, dari
    design/references/dusk-haze-app-showcase.webp). -->
  <title>pavana</title>
  <defs>
    <linearGradient id="pv-favicon-dusk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252B4D" />
      <stop offset="0.55" stop-color="#4E3B5E" />
      <stop offset="1" stop-color="#8A5F74" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#pv-favicon-dusk)" />
