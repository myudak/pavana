<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Overlay for public/og.png (1200×630). Composited over packages/brand/assets/backgrounds/sunset.webp
       by the OG build step. No data values on purpose. -->
  <defs>
    <linearGradient id="scrim" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0e1120" stop-opacity="0.82" />
      <stop offset="0.65" stop-color="#0e1120" stop-opacity="0.35" />
      <stop offset="1" stop-color="#0e1120" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#fbcfe8" />
      <stop offset="0.5" stop-color="#f472b6" />
      <stop offset="1" stop-color="#a5b4fc" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#scrim)" />
  <text x="80" y="118" font-family="Comfortaa, 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-2" fill="#ffffff">pavana</text>
  <text x="80" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="5" fill="#ffffff" fill-opacity="0.75">WEATHER · AIR QUALITY · WILDFIRE</text>
  <text x="80" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-2" fill="#ffffff">Apakah asap kebakaran</text>
  <text x="80" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="-2" fill="url(#accent)">akan sampai ke tempatmu?</text>
  <text x="80" y="500" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#ffffff" fill-opacity="0.85">Titik panas satelit, angin, dan prakiraan PM2.5 — dalam satu jawaban sederhana.</text>
  <text x="80" y="566" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#fbcfe8">pavana.myudak.com</text>
</svg>
